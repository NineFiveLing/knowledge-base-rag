# ============================================
# 基础服务：企业知识库 RAG 基础设施（开发环境）
# ============================================

services:
  # =================== PostgreSQL 数据库 (PGVector) ===================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kb-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: knowledge_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./docker/init-pgvector:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d knowledge_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =================== pgAdmin PostgreSQL 管理工具 ===================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kb-pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network
    depends_on:
      - postgres

  # =================== Elasticsearch 搜索引擎 ===================
  elasticsearch:
    build:
      context: .
      dockerfile: docker/Dockerfile.elasticsearch
    container_name: kb-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - app-network

  # =================== Kibana 可视化工具 ===================
  kibana:
    image: kibana:8.11.0
    container_name: kb-kibana
    restart: always
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - app-network
    depends_on:
      - elasticsearch

  # =================== Neo4j 图数据库 ===================
  neo4j:
    image: neo4j:latest
    container_name: kb-neo4j
    restart: always
    ports:
      - "7474:7474" # HTTP 接口
      - "7687:7687" # Bolt 协议
    environment:
      - NEO4J_AUTH=neo4j/neo4j123456
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_pagecache_size=256M
      - NEO4J_dbms_memory_heap_max__size=512M
    volumes:
      - neo4j_data:/data
    networks:
      - app-network

  # =================== Redis 缓存服务（短期记忆）===================
  redis:
    image: redis:7-alpine
    container_name: kb-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =================== RedisInsight 可视化工具 ===================
  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: kb-redisinsight
    restart: always
    ports:
      - "5540:5540"
    environment:
      - RI_HOST=0.0.0.0
    networks:
      - app-network
    depends_on:
      - redis

  # =================== MongoDB 文档正文存储 ===================
  mongo:
    image: mongo:7
    container_name: kb-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: knowledge_rag
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =================== Mongo Express 可视化工具 ===================
  mongo-express:
    image: mongo-express:latest
    container_name: kb-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    networks:
      - app-network
    depends_on:
      - mongo

  # =================== RustFS 对象存储（文件/图片/附件）===================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: kb-rustfs
    restart: always
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_DATA_DIR: /data
    volumes:
      - rustfs_data:/data
    networks:
      - app-network

# =================== 网络配置 ===================
networks:
  app-network:
    driver: bridge

# =================== 数据卷 ===================
volumes:
  postgres_data:
  pgadmin_data:
  elasticsearch_data:
  neo4j_data:
  redis_data:
  mongodb_data:
  rustfs_data:
